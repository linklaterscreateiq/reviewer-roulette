# Type-checks the source, builds the bundle that actually gets published, and
# runs it end to end against stub APIs.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Build

on:
  push:
    branches: [ "main" ]
  # Every pull request, not only those targeting main, so that one stacked on
  # another is checked too. Leaving push filtered to main keeps that to one run
  # per commit rather than two.
  pull_request:

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Install the toolchain from mise.toml
      uses: jdx/mise-action@v4
    - name: Cache npm downloads
      uses: actions/cache@v6
      with:
        path: ~/.npm
        key: npm-${{ hashFiles('package-lock.json') }}
        restore-keys: npm-
    - run: npm ci
    - name: Lint
      run: npm run lint
    - name: Type-check
      run: npm run tsc
    - name: Bundle
      run: npm run bundle
    - name: Smoke test
      run: node scripts/smoke-test.mjs
    - name: Proxy check
      run: node scripts/proxy-check.mjs
